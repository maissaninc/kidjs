<!DOCTYPE HTML>
<html>
  <head>
    <title>Grid</title>
    <script src="../dist/kid.js"></script>
  </head>
  <body>
    <script>

        KID.settings.pixelSize = 20;
        KID.settings.grid = true;

        document.addEventListener('keydown', (event) => {
            if (event.key === 'g') {
                if (KID.settings.grid) {
                    console.log('grid off')
                    KID.settings.pixelSize = 1;
                    KID.settings.grid = false;
                } else {
                    console.log('grid on')
                    KID.settings.pixelSize = 20;
                    KID.settings.grid = true;
                }
            }
        });

    </script>
    <script type="kidjs">

      pixel(0, 0, 'red')
      pixel(1, 1, 'green')
      pixel(2, 2, 'blue')
      pixel(3, 3, 'yellow')
      pixel(4, 4, 'purple')
      pixel(5, 5, 'orange')
      pixel(6, 6, 'brown')
      pixel(7, 7, 'gray')
      pixel(8, 8)

      console.log(getPixel(0, 0))

      on('click', function() {
        pixel(mouseX, mouseY)
      })

    </script>
  </body>
</html>
